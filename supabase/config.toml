project_id = "gestiones-comerciales"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

# Copia tenant_id/rol de app_metadata a la raíz del JWT (RLS histórica).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

# auth-guard: login centralizado, rate limit y CORS propios (sin JWT previo)
[functions.auth-guard]
verify_jwt = false

# rastreo-ingesta: JWT del asesor en campo
[functions.rastreo-ingesta]
verify_jwt = true

# push-notifications: solo service_role (Task 12)
[functions.push-notifications]
verify_jwt = true

# pdf-solicitud se autentica con JWT del usuario (firma + PDF)
[functions.pdf-solicitud]
verify_jwt = true

# invitar-usuario: JWT del admin; crea auth user con service_role
[functions.invitar-usuario]
verify_jwt = true

# notify-jobs se autentica con secret compartido (x-notify-secret), no con JWT
[functions.notify-jobs]
verify_jwt = false

# importer: JWT del admin/plataforma; parsea CSV y llama RPC admin_importar_*
[functions.importer]
verify_jwt = true

# webhook-tenant: HMAC propio (X-GC-Signature), sin JWT
[functions.webhook-tenant]
verify_jwt = false
