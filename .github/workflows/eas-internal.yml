name: EAS Play Internal

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

permissions:
  contents: read

jobs:
  internal:
    name: Production AAB + submit Android
    runs-on: ubuntu-latest
    environment: eas-android
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Verificar acceso a Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta EXPO_TOKEN para EAS en GitHub"
            exit 1
          fi
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Instalar dependencias
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: EAS production AAB
        run: eas build --platform android --profile production --non-interactive
      - name: Submit Play Internal Testing
        run: eas submit --platform android --latest --non-interactive --profile production
