name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Contratos CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Contratos de pipeline
        run: node --experimental-strip-types --test tests/*.test.ts scripts/ci/*.test.ts scripts/ops/*.test.ts

  security:
    name: Seguridad (OWASP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rechazar archivos .env versionados
        run: |
          echo "Buscando .env fuera de *.example..."
          FOUND=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Archivos .env detectados en el repositorio:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: sin .env versionados"

      - name: Escanear secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Audit de dependencias runtime (web + backoffice)
        run: |
          # pnpm audit no acepta --filter (Unknown option: recursive) y --dir
          # sigue leyendo el lockfile del workspace (incluye mobile/Expo).
          # El script falla solo si hay high/critical en @gc/web o @gc/backoffice.
          pnpm audit --prod --json > /tmp/pnpm-audit.json || true
          node --experimental-strip-types scripts/ci/audit-runtime.ts < /tmp/pnpm-audit.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint

  validate:
    name: Validar (SQL + Edge + builds)
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias (workspace)
        run: pnpm install --frozen-lockfile

      - name: Validar migraciones SQL (orden forwards-only)
        run: |
          echo "Validando migraciones..."
          ls supabase/migrations/*.sql | sort | awk -F/ '{print $NF}' > /tmp/migs
          sort -c /tmp/migs || { echo "ERROR: migraciones fuera de orden"; exit 1; }
          echo "OK: $(wc -l < /tmp/migs) migraciones en orden"

      - name: Deno fmt, lint, check y test
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions
          for f in supabase/functions/*/index.ts; do
            deno check "$f"
          done
          deno test supabase/functions/_shared/ supabase/functions --allow-env --allow-read || deno test supabase/functions/_shared/

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests unitarios web
        run: pnpm --filter @gc/web test

      - name: Tests unitarios backoffice
        run: pnpm --filter @gc/backoffice test

      - name: Tests unitarios móvil
        run: pnpm --filter @gc/mobile test

      - name: Artefactos EAS del móvil
        run: |
          test -f apps/mobile/eas.json
          test -f apps/mobile/assets/icon.png
          test -f apps/mobile/google-services.json
          echo "OK: EAS + icono + google-services"

      - name: Build apps (web + backoffice)
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: tu_anon_key_aqui_placeholder
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_RELEASE: ci
          VITE_ENVIRONMENT: local
        run: |
          pnpm --filter @gc/web build
          pnpm --filter @gc/backoffice build

      - name: Presupuesto bundle web (entry ≤ 450 kB gzip)
        run: node scripts/ci/bundle-budget.mjs apps/web/dist

      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @gc/web exec playwright install --with-deps chromium

      - name: E2E web + axe (fixtures locales)
        run: pnpm --filter @gc/web test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: tu_anon_key_aqui_placeholder
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_RELEASE: ci
          VITE_ENVIRONMENT: local

      - name: E2E backoffice + axe (fixtures locales)
        run: pnpm --filter @gc/backoffice test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: tu_anon_key_aqui_placeholder
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_RELEASE: ci
          VITE_ENVIRONMENT: local

  pgtap:
    name: pgTAP (blank + replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: pgTAP blank + replay
        run: bash scripts/ci/pgtap.sh
      - name: Artefacto log SQL
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgtap-log
          path: /tmp/pgtap.log
          if-no-files-found: ignore

  security-definer:
    name: SECURITY DEFINER allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear funciones SECURITY DEFINER
        run: |
          test -f supabase/tests/security_definer_allowlist.txt
          bash scripts/ci/scan-security-definer.sh
