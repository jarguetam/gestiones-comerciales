name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  security:
    name: Seguridad (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A01 Broken Access Control / A02 Crypto Failures — nada de secretos ni .env en el repo
      - name: Rechazar archivos .env versionados
        run: |
          echo "Buscando .env fuera de *.example..."
          FOUND=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Archivos .env detectados en el repositorio:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: sin .env versionados"

      - name: Escanear secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A06 Vulnerable and Outdated Components — dependencias con CVEs conocidos
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit de dependencias runtime (bloqueante en critical)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm audit --prod --audit-level=critical || {
            echo "::error::Vulnerabilidades críticas en dependencias de runtime (OWASP A06)"
            exit 1
          }

      - name: Audit de dependencias (informativo — high conocido sin parche)
        run: |
          # Riesgo aceptado (todas dev-only, sin parche disponible, no llegan al bundle):
          #  - @xmldom/xmldom 0.7.x (vía @expo/plist, solo CLI local de Expo)
          #  - image-size <=2.0.2 (GHSA sin parche, vía CLI de Expo)
          #  - tar 6.x vía cacache@18 (CLI) — mitigado con override tar 7.5.22
          pnpm audit --audit-level=high || echo "::warning::ver riesgo aceptado arriba"
        continue-on-error: true

  validate:
    name: Validar (SQL + Edge + builds)
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar migraciones SQL (orden forwards-only)
        run: |
          echo "Validando migraciones..."
          ls supabase/migrations/*.sql | sort | awk -F/ '{print $NF}' > /tmp/migs
          sort -c /tmp/migs || { echo "ERROR: migraciones fuera de orden"; exit 1; }
          echo "OK: $(wc -l < /tmp/migs) migraciones en orden"

      - name: Lint de Edge Functions (Deno)
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            for f in supabase/functions/*/index.ts; do
              deno check "$f"
            done
          else
            echo "Sin Edge Functions aún"
          fi

      - name: Tests unitarios de helpers Edge (CSV + HMAC)
        run: deno test supabase/functions/_shared/

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Instalar dependencias (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Tests unitarios web (dashboard, auditoría, MFA, branding)
        run: pnpm --filter @gc/web test

      - name: Tests unitarios backoffice (P-05 + P-06)
        run: pnpm --filter @gc/backoffice test

      - name: Tests unitarios móvil (cola offline, MFA, notifs, persistencia)
        run: pnpm --filter @gc/mobile test

      - name: Artefactos EAS del móvil
        run: |
          test -f apps/mobile/eas.json
          test -f apps/mobile/assets/icon.png
          test -f apps/mobile/google-services.json
          echo "OK: EAS + icono + google-services"

      - name: Typecheck + build apps (web + backoffice + mobile)
        run: |
          pnpm --filter @gc/web build
          pnpm --filter @gc/backoffice build
          pnpm --filter @gc/mobile typecheck

      # E2E en DEMO_MODE: este job no inyecta VITE_SUPABASE_* (si CI no puede autenticar, el preview es estático).
      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @gc/web exec playwright install --with-deps chromium

      - name: E2E web + axe (DEMO)
        run: pnpm --filter @gc/web test:e2e
        env:
          CI: true

      - name: E2E backoffice + axe (DEMO)
        run: pnpm --filter @gc/backoffice test:e2e
        env:
          CI: true

  deploy:
    name: Despliegue en GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Build web + backoffice (con Supabase real)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @gc/web build
          pnpm --filter @gc/backoffice build

      - name: Preparar artefactos estáticos
        run: |
          mkdir -p _site/web _site/backoffice
          cp -r apps/web/dist/* _site/web/
          cp -r apps/backoffice/dist/* _site/backoffice/
          # Raíz: la aplicación principal de agenda y calendario con todas sus vistas
          cp -r apps/web/dist/* _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edge:
    name: Desplegar Edge Functions
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xcoeipsnykceorcvjwve
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta secret SUPABASE_ACCESS_TOKEN; no se desplegaron Edge Functions."
            echo "Creá un token en supabase.com/dashboard/account/tokens y cargalo como secret del repo."
            exit 0
          fi
          chmod +x scripts/deploy-functions.sh
          ./scripts/deploy-functions.sh
