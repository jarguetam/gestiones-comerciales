name: EAS Preview APK

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    name: Preview Android APK
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'android-preview')
    runs-on: ubuntu-latest
    environment: eas-android
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Verificar acceso a Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta EXPO_TOKEN para EAS en GitHub"
            exit 1
          fi
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Instalar dependencias
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Expo Doctor
        run: npx expo-doctor
      - name: EAS preview APK (backend producción)
        run: eas build --platform android --profile preview --non-interactive
