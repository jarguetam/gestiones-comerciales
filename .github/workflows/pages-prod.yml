name: Pages producción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Exigir secretos públicos de producción
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
          SENTRY_PROJECT_BACKOFFICE: ${{ secrets.SENTRY_PROJECT_BACKOFFICE }}
          VITE_ENVIRONMENT: production
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$VITE_SENTRY_DSN" ] && missing="$missing VITE_SENTRY_DSN"
          [ -z "$SENTRY_AUTH_TOKEN" ] && missing="$missing SENTRY_AUTH_TOKEN"
          [ -z "$SENTRY_ORG" ] && missing="$missing SENTRY_ORG"
          [ -z "$SENTRY_PROJECT_WEB" ] && missing="$missing SENTRY_PROJECT_WEB"
          [ -z "$SENTRY_PROJECT_BACKOFFICE" ] && missing="$missing SENTRY_PROJECT_BACKOFFICE"
          if [ -n "$missing" ]; then
            echo "::error::GC-OPS-008: faltan secretos de production:$missing"
            exit 1
          fi
          if echo "$VITE_SUPABASE_URL" | grep -qi 'service_role'; then
            echo "::error::Pages no puede recibir service_role"
            exit 1
          fi

      - name: Build web + backoffice
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENVIRONMENT: production
        run: |
          VITE_RELEASE="web@${GITHUB_SHA}" pnpm --filter @gc/web build
          VITE_RELEASE="backoffice@${GITHUB_SHA}" pnpm --filter @gc/backoffice build

      - name: Preparar artefactos estáticos
        run: |
          mkdir -p _site/web _site/backoffice
          cp -r apps/web/dist/* _site/web/
          cp -r apps/backoffice/dist/* _site/backoffice/
          cp -r apps/web/dist/* _site/

      - name: Instalar Chromium para smoke productivo
        run: pnpm --filter @gc/web exec playwright install --with-deps chromium

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke login (sin demo)
        env:
          PAGES_PROD_URL: ${{ steps.deployment.outputs.page_url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: bash scripts/ops/pages-smoke.sh "${PAGES_PROD_URL:-https://jarguetam.github.io/gestiones-comerciales/}"

      - name: Sentry release web + backoffice
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
          SENTRY_PROJECT_BACKOFFICE: ${{ secrets.SENTRY_PROJECT_BACKOFFICE }}
        run: |
          npm i -g @sentry/cli@2
          SENTRY_PROJECT="$SENTRY_PROJECT_WEB" bash scripts/ops/sentry-release.sh "web@${GITHUB_SHA}"
          SENTRY_PROJECT="$SENTRY_PROJECT_BACKOFFICE" bash scripts/ops/sentry-release.sh "backoffice@${GITHUB_SHA}"
